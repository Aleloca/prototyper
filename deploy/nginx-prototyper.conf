# Prototyper: one nginx site for the panel and every preview domain.
#
# It is the *default server*: it answers for hostnames that no other nginx site claims, so existing
# sites on the machine are untouched. Prototyper itself obtains and renews the HTTPS certificates
# (Let's Encrypt, HTTP-01) and writes them to __CERTS_DIR__/<hostname>/, which nginx loads by name.
# Requires nginx 1.15.9+ (variables in ssl_certificate).

server {
    listen 80 default_server;
    server_name _;

    # Certificate challenges are answered by Prototyper.
    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     __CERTS_DIR__/$ssl_server_name/fullchain.pem;
    ssl_certificate_key __CERTS_DIR__/$ssl_server_name/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Version uploads (the whole built site) and client image uploads.
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
