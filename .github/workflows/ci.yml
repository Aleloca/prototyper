name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prototyper/overlay build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @prototyper/panel build && pnpm --filter @prototyper/server build
      # The plugin ships a bundled MCP server: it must match the sources.
      - name: Plugin bundle is up to date
        run: pnpm --filter @prototyper/mcp build && git diff --exit-code plugin/server
